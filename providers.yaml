# Каталог сервисов (ТЗ §4). Правила подстановки задаёт шлюз, а не агент.
# maxBody в байтах, timeout в секундах. fields — что спрашивает экран 3.
# keyHint — подсказка на английском (ТЗ v1.2 §2).
#
# builder выбирает разбор ввода владельца (src/catalog.js): static (по умолчанию, только ключ),
# webhook (ссылка вебхука), subdomain (адрес из hostTemplate), basic (HTTP Basic), other (только slug other).
# У фиксированного host (не owner) адрес из ввода не берётся никогда.
# Тип подстановки `encode: base64` (builder basic): значение заголовка — prefix + base64(секрет),
# секрет в сейфе — `логин:ключ`; логин задаёт basicLogin ({account} по умолчанию, {email}/token у Zendesk).
#
# sensitive: true — платёжный сервис; перевод в «always» требует доп. подтверждения.
# getKeyUrl — только https; getKeyHint — подсказка en (ru: ключ catalog.getkey.<slug>).
# accountPlaceholder — пример в поле account (короткая строка, только при поле account; не настоящий идентификатор).
# warning: true — на форме ключа показывается catalog.warn.<slug>.
# filterFrom: <slug> — фильтр данных и readOnly копируются у другого провайдера при загрузке.
# readOnly (слой 1): нет поля — у сервиса недоступен (запись неотличима от чтения); true — GET/HEAD;
#   объект { style: rest|rpc, extraRoutes: ['POST /путь'] (POST-чтение), readMethods: [шаблоны] (rpc), default: true (у новых ключей включён) }.
# mask: false — маскировка личных данных недоступна (LLM и потоковые сервисы).
defaults:
  maxBody: 2097152
  timeout: 60
  kind: static
  fields: [key]

providers:
  openai:
    name: OpenAI
    host: api.openai.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^sk-[A-Za-z0-9_-]{20,}$'
    keyHint: 'expected key like sk-…'
    getKeyUrl: 'https://platform.openai.com/api-keys'
    mask: false
  anthropic:
    name: Anthropic
    host: api.anthropic.com
    injection: { type: header, name: x-api-key }
    keyPattern: '^sk-ant-[A-Za-z0-9_-]{20,}$'
    keyHint: 'expected key like sk-ant-…'
    extraHeaders: { 'anthropic-version': '2023-06-01' }
    getKeyUrl: 'https://platform.claude.com/settings/keys'
    mask: false
  gemini:
    name: Google Gemini
    host: generativelanguage.googleapis.com
    injection: { type: header, name: x-goog-api-key }
    keyPattern: '^AIza[0-9A-Za-z_-]{30,}$'
    keyHint: 'expected key like AIza…'
    getKeyUrl: 'https://aistudio.google.com/apikey'
    mask: false
  openrouter:
    name: OpenRouter
    host: openrouter.ai
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^sk-or-[0-9A-Za-z_-]{20,}$'
    keyHint: 'expected key like sk-or-…'
    getKeyUrl: 'https://openrouter.ai/keys'
    mask: false
  groq:
    name: Groq
    host: api.groq.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^gsk_[0-9A-Za-z]{20,}$'
    keyHint: 'expected key like gsk_…'
    getKeyUrl: 'https://console.groq.com/keys'
    mask: false
  mistral:
    name: Mistral
    host: api.mistral.ai
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    getKeyUrl: 'https://console.mistral.ai/api-keys'
    mask: false
  github:
    name: GitHub
    host: api.github.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^(ghp_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{40,})$'
    keyHint: 'expected token like ghp_… or github_pat_…'
    extraHeaders: { 'x-github-api-version': '2022-11-28', 'user-agent': 'agent-gateway' }
    getKeyUrl: 'https://github.com/settings/personal-access-tokens/new'
    getKeyHint: 'Create a fine-grained token with read-only access to the repositories you need'
    readOnly: true
  slack:
    name: Slack
    host: slack.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^xox[abp]-[A-Za-z0-9-]+$'
    keyHint: 'expected token like xoxb-… or xoxp-…'
    getKeyUrl: 'https://api.slack.com/apps?new_app=1'
    getKeyHint: 'Create an app, add only the bot scopes you need, install it and copy the Bot User OAuth Token'
  notion:
    name: Notion
    host: api.notion.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^(secret_|ntn_)[A-Za-z0-9]+$'
    keyHint: 'expected key like secret_… or ntn_…'
    extraHeaders: { 'notion-version': '2022-06-28' }
    getKeyUrl: 'https://www.notion.so/profile/integrations'
    # POST, который только читает: поиск и запрос к базе данных
    readOnly: { extraRoutes: ['POST /v1/search', 'POST /v1/databases/:id/query'] }
  linear:
    name: Linear
    host: api.linear.app
    # Linear принимает голый ключ в authorization, без «Bearer ».
    injection: { type: header, name: authorization }
    keyPattern: '^lin_api_[A-Za-z0-9]+$'
    keyHint: 'expected key like lin_api_…'
    getKeyUrl: 'https://linear.app/settings/account/security'
  stripe:
    name: Stripe
    host: api.stripe.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^(sk|rk)_(live|test)_[A-Za-z0-9]+$'
    keyHint: 'expected key like sk_live_… or rk_test_…'
    getKeyUrl: 'https://dashboard.stripe.com/apikeys'
    getKeyHint: 'Create a restricted key (rk_…) with only the permissions you need, read-only if possible'
    sensitive: true
    readOnly: { default: true }
  hubspot:
    name: HubSpot
    host: api.hubapi.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^pat-[a-z0-9]+-[a-f0-9-]+$'
    keyHint: 'expected a service key like pat-eu1-…'
    # private apps закрыты 26.10.2026; service key (тот же формат pat-…) проверен на тестовом аккаунте 04.11.2026
    getKeyUrl: 'https://app.hubspot.com/l/service-keys'
    getKeyHint: 'Create a service key with read scopes only: crm.objects.deals.read (plus contacts and companies if you need them)'
    # CRM: чтение включено у новых ключей сразу; POST поиска только читает
    readOnly: { default: true, extraRoutes: ['POST /crm/v3/objects/*/search'] }
    # Фильтр данных, REST-стиль (п. 7.3, ТЗ §9.3). Поля сделок проверены на живом тестовом аккаунте 04.11.2026:
    # все пути есть в ответе, фильтр по умолчанию пропускает только разрешённое.
    filter:
      style: rest
      unverified: false
      keep: [status, message, category, correlationId, total, paging.next.after]
      deny:
        - ANY /crm/v3/objects/contacts/**
        - ANY /crm/v3/objects/companies/**
        - ANY /crm/v3/objects/*/batch/**
        - ANY /crm/v3/exports/**
        - ANY /crm/v4/associations/**
        - ANY /crm/v3/associations/**
        - ANY /crm/v3/owners/**
        - ANY /crm/v3/imports/**
      denyQuery: [associations, propertiesWithHistory, archived]
      selectParam: properties
      selectFormat: comma
      selectFor: ['GET /crm/v3/objects/deals']
      entities:
        deals:
          name: Deals without contacts
          routes:
            - GET /crm/v3/objects/deals
            - GET /crm/v3/objects/deals/:id
          extras:
            search:
              label: Search deals
              routes: ['POST /crm/v3/objects/deals/search']
          fields:
            - { paths: ['results[].id', 'id'], label: ID }
            - { paths: ['results[].properties.dealname', 'properties.dealname'], label: Title }
            - { paths: ['results[].properties.dealstage', 'properties.dealstage'], label: Stage }
            - { paths: ['results[].properties.pipeline', 'properties.pipeline'], label: Pipeline }
            - { paths: ['results[].properties.amount', 'properties.amount'], label: Amount }
            - { paths: ['results[].properties.closedate', 'properties.closedate'], label: Close date }
            - { paths: ['results[].properties.hubspot_owner_id', 'properties.hubspot_owner_id'], label: Owner (ID) }
            - { paths: ['results[].properties.createdate', 'properties.createdate'], label: Created }
            - { paths: ['results[].properties.hs_lastmodifieddate', 'properties.hs_lastmodifieddate'], label: Modified }
            - { paths: ['results[].createdAt', 'createdAt'], label: Created (record) }
            - { paths: ['results[].updatedAt', 'updatedAt'], label: Updated (record) }
          defaults: ['results[].id', 'id', 'results[].properties.dealstage', 'properties.dealstage', 'results[].properties.createdate', 'properties.createdate']
  pipedrive:
    name: Pipedrive
    host: api.pipedrive.com
    injection: { type: header, name: x-api-token }
    getKeyUrl: 'https://app.pipedrive.com/settings/api'
    getKeyHint: 'Copy your personal API token'
    readOnly: { default: true }
    # Фильтр данных, REST-стиль (п. 7.3). Проверено на живом тестовом аккаунте 04.11.2026 (v1 и v2: owner_id есть только в v2,
    # user_id — только в v1). В v1 person_id/org_id/user_id приходят объектами с именем,
    # e-mail и телефоном, а person_name/org_name/owner_name строками; без object:true объекты вырезаются целиком,
    # непоименованные поля (в том числе кастомные) тоже. Единственное «внутреннее» поле: id владельца.
    filter:
      style: rest
      unverified: false
      keep: [success, error, error_info, additional_data.next_cursor, additional_data.pagination.more_items_in_collection, additional_data.pagination.next_start]
      deny:
        - ANY /v1/persons/**
        - ANY /v1/organizations/**
        - ANY /v1/activities/**
        - ANY /v1/notes/**
        - ANY /v1/files/**
        - ANY /v1/mailbox/**
        - ANY /v1/users/**
        - ANY /v1/itemSearch/**
        - ANY /v1/deals/search
        - ANY /v1/deals/*/participants/**
        - ANY /v1/deals/*/persons/**
        - ANY /v1/deals/*/mailMessages/**
        - ANY /v1/deals/*/followers/**
        - ANY /api/v2/persons/**
        - ANY /api/v2/organizations/**
        - ANY /api/v2/activities/**
        - ANY /api/v2/itemSearch/**
        - ANY /api/v2/deals/search
        - ANY /api/v2/deals/*/followers/**
      # фильтр по персоне, организации или сохранённому фильтру выдаёт наличие совпадений (П-18)
      denyQuery: [person_id, org_id, filter_id]
      entities:
        deals:
          name: Deals without persons
          routes:
            - GET /v1/deals
            - GET /v1/deals/:id
            - GET /api/v2/deals
            - GET /api/v2/deals/:id
          fields:
            - { path: 'data[].id', label: ID }
            - { path: 'data[].title', label: Title }
            - { path: 'data[].status', label: Status }
            - { path: 'data[].stage_id', label: Stage (ID) }
            - { path: 'data[].pipeline_id', label: Pipeline (ID) }
            - { path: 'data[].value', label: Amount }
            - { path: 'data[].currency', label: Currency }
            - { path: 'data[].user_id.id', label: Owner (ID) }
            - { path: 'data[].owner_id', label: Owner (ID, API v2) }
            - { path: 'data[].add_time', label: Created }
            - { path: 'data[].update_time', label: Modified }
            - { path: 'data[].close_time', label: Closed at }
            - { path: 'data[].expected_close_date', label: Expected close date }
          defaults: ['data[].id', 'data[].status', 'data[].stage_id', 'data[].add_time']
  zendesk:
    name: Zendesk
    # Поддомен аккаунта из ввода, хост строится только по шаблону. HTTP Basic: `email/token:ключ`.
    # Zendesk с 27.10.2026 не выдаёт новые API-токены, существующие работают до 30.04.2027; OAuth (client_credentials) — после запуска.
    host: owner
    builder: basic
    hostTemplate: '{account}.zendesk.com'
    hostPattern: '^[a-z0-9-]+\.zendesk\.com$'
    basicLogin: '{email}/token'
    injection: { type: header, name: authorization, prefix: 'Basic ', encode: base64 }
    fields: [account, email, key]
    accountPlaceholder: 'mycompany'
    keyHint: 'subdomain like mycompany (or mycompany.zendesk.com), the e-mail of the token owner and an API token. New tokens are not issued after 27 Oct 2026'
    getKeyUrl: 'https://developer.zendesk.com/api-reference/introduction/security-and-auth/'
    getKeyHint: 'Zendesk stops issuing new API tokens on 27 Oct 2026; existing tokens work until 30 Apr 2027. OAuth support comes later'
    readOnly: { default: true }
    # Фильтр данных, REST-стиль (п. 7.3). unverified: см. hubspot. requester_id остаётся (скаляр, без имени и e-mail);
    # via (канал с адресом отправителя), custom_fields, tags и вложенные объекты вырезаются. subject и description
    # могут содержать данные клиента: поля есть в списке, но по умолчанию не отмечены. include=users и подобные закрыты denyQuery.
    filter:
      style: rest
      unverified: true
      keep: [error, message, count, next_page, previous_page]
      deny:
        - ANY /api/v2/users/**
        - ANY /api/v2/users.json
        - ANY /api/v2/organizations/**
        - ANY /api/v2/organizations.json
        - ANY /api/v2/requests/**
        - ANY /api/v2/requests.json
        - ANY /api/v2/search/**
        - ANY /api/v2/search.json
        - ANY /api/v2/tickets/*/comments/**
        - ANY /api/v2/tickets/*/audits/**
        - ANY /api/v2/ticket_audits/**
        - ANY /api/v2/tickets/*/requester/**
        - ANY /api/v2/tickets/*/collaborators/**
        - ANY /api/v2/tickets/*/followers/**
        - ANY /api/v2/tickets/*/email_ccs/**
        - ANY /api/v2/tickets/create_many/**
        - ANY /api/v2/tickets/update_many/**
        - ANY /api/v2/tickets/destroy_many/**
        - ANY /api/v2/tickets/show_many/**
        - ANY /api/v2/incremental/**
        - ANY /api/v2/attachments/**
        - ANY /api/v2/uploads/**
        - ANY /api/v2/user_fields/**
      denyQuery: [include]
      entities:
        tickets:
          name: Tickets without customer data
          routes:
            - GET /api/v2/tickets
            - GET /api/v2/tickets.json
            - GET /api/v2/tickets/:id
          fields:
            - { paths: ['tickets[].id', 'ticket.id'], label: ID }
            - { paths: ['tickets[].status', 'ticket.status'], label: Status }
            - { paths: ['tickets[].priority', 'ticket.priority'], label: Priority }
            - { paths: ['tickets[].type', 'ticket.type'], label: Type }
            - { paths: ['tickets[].requester_id', 'ticket.requester_id'], label: Requester (ID) }
            - { paths: ['tickets[].submitter_id', 'ticket.submitter_id'], label: Submitter (ID) }
            - { paths: ['tickets[].assignee_id', 'ticket.assignee_id'], label: Assignee (ID) }
            - { paths: ['tickets[].group_id', 'ticket.group_id'], label: Group (ID) }
            - { paths: ['tickets[].via.channel', 'ticket.via.channel'], label: Channel }
            - { paths: ['tickets[].created_at', 'ticket.created_at'], label: Created }
            - { paths: ['tickets[].updated_at', 'ticket.updated_at'], label: Modified }
            - { paths: ['tickets[].due_at', 'ticket.due_at'], label: Due }
            - { paths: ['tickets[].subject', 'ticket.subject'], label: Subject (may contain customer data) }
            - { paths: ['tickets[].description', 'ticket.description'], label: First message (may contain customer data) }
          defaults: ['tickets[].id', 'ticket.id', 'tickets[].status', 'ticket.status', 'tickets[].requester_id', 'ticket.requester_id', 'tickets[].created_at', 'ticket.created_at']
  atlassian:
    name: Atlassian
    # Jira Cloud (/rest/api/3/...) и Confluence Cloud (/wiki/api/v2/...) на одном хосте <сайт>.atlassian.net.
    # Хост строится только по шаблону из ввода. HTTP Basic: `email:api_token`. Фильтра данных нет.
    host: owner
    builder: basic
    hostTemplate: '{account}.atlassian.net'
    hostPattern: '^[a-z0-9-]+\.atlassian\.net$'
    basicLogin: '{email}'
    injection: { type: header, name: authorization, prefix: 'Basic ', encode: base64 }
    fields: [account, email, key]
    accountPlaceholder: 'mycompany'
    keyHint: 'site name like mycompany (or mycompany.atlassian.net), the e-mail of the token owner and an API token'
    getKeyUrl: 'https://id.atlassian.com/manage-profile/security/api-tokens'
    getKeyHint: 'The token has all permissions of its owner: create it for a dedicated account that can only read what the agent needs'
    # POST поиска JQL и подсчёта только читают
    readOnly: { default: true, extraRoutes: ['POST /rest/api/3/search/jql', 'POST /rest/api/3/search/approximate-count'] }
  airtable:
    name: Airtable
    host: api.airtable.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    # personal access token: pat + 14 символов, точка, 64 hex (проверено по документации; формат не привязан к длине)
    keyPattern: '^pat[A-Za-z0-9]+\.[A-Za-z0-9]+$'
    keyHint: 'expected a personal access token like pat…'
    getKeyUrl: 'https://airtable.com/create/tokens'
    getKeyHint: 'Create a personal access token with the data.records:read scope and only the bases you need'
    # POST listRecords только читает (длинный фильтр вместо GET)
    readOnly: { default: true, extraRoutes: ['POST /v0/*/*/listRecords'] }
  resend:
    name: Resend
    host: api.resend.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^re_[A-Za-z0-9_]+$'
    keyHint: 'expected key like re_…'
    getKeyUrl: 'https://resend.com/api-keys'
  sendgrid:
    name: SendGrid
    host: api.sendgrid.com
    injection: { type: header, name: authorization, prefix: 'Bearer ' }
    keyPattern: '^SG\.[A-Za-z0-9_.-]+$'
    keyHint: 'expected key like SG.…'
    getKeyUrl: 'https://app.sendgrid.com/settings/api_keys'
  twilio:
    name: Twilio
    # Фиксированный хост: Account SID идёт в секрет (Basic) как логин. Секрет — Auth Token; сам SID — идентификатор
    # аккаунта и виден в путях API (/Accounts/<SID>/…), поэтому попадает в журналы и аудит (SECURITY.md, ревью staging R-4).
    host: api.twilio.com
    builder: basic
    accountPattern: '^AC[a-f0-9]{32}$'
    injection: { type: header, name: authorization, prefix: 'Basic ', encode: base64 }
    fields: [account, key]
    accountPlaceholder: 'ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
    keyHint: 'Account SID (AC… followed by 32 hex characters) and Auth Token'
    getKeyUrl: 'https://console.twilio.com/'
    getKeyHint: 'Account SID and Auth Token are on the console home page'
    sensitive: true
    readOnly: { default: true } # отправка SMS и звонки — деньги и сообщения от имени владельца
  deepgram:
    name: Deepgram
    host: api.deepgram.com
    injection: { type: header, name: authorization, prefix: 'Token ' }
    keyPattern: '^[0-9a-f]{40}$'
    keyHint: 'expected 40 hexadecimal characters'
    getKeyUrl: 'https://developers.deepgram.com/docs/create-additional-api-keys'
    maxBody: 209715200
    timeout: 600
    mask: false
  elevenlabs:
    name: ElevenLabs
    host: api.elevenlabs.io
    injection: { type: header, name: xi-api-key }
    getKeyUrl: 'https://elevenlabs.io/app/settings/api-keys'
    mask: false
  telegram:
    name: Telegram Bot API
    host: api.telegram.org
    kind: path
    injection: { type: path, template: '/bot{secret}' }
    keyPattern: '^\d+:[A-Za-z0-9_-]{35}$'
    keyHint: 'expected bot token like 123456:AAE…'
    getKeyUrl: 'https://t.me/BotFather'
    getKeyHint: 'Send /newbot to BotFather and copy the token'
    # getUpdates исключён: он сдвигает очередь обновлений бота
    readOnly:
      style: rpc
      readMethods: [getMe, getChat, getChatMemberCount, getChatAdministrators]
  bitrix24:
    name: Bitrix24
    host: owner
    builder: webhook
    # Только облачные порталы Bitrix24; коробочный портал — отдельный провайдер bitrix24-box.
    hostPattern: '^[a-z0-9-]+\.bitrix24\.(ru|com|by|kz|ua|de|eu)$'
    kind: path
    injection: { type: path, template: '/rest/{secret}' }
    fields: [webhook_url]
    keyHint: 'paste the full incoming webhook URL, e.g. https://mycompany.bitrix24.ru/rest/17/k3j9fh2x8s7d/'
    getKeyUrl: 'https://apidocs.bitrix24.com/local-integrations/local-webhooks.html'
    # Только чтение (п. 7.2): у новых ключей включено сразу; bitrix24-box берёт то же через filterFrom
    readOnly:
      style: rpc
      default: true
      readMethods: ['crm.*.list', 'crm.*.get', 'crm.*.fields', user.get, user.fields]
    # Фильтр данных (ТЗ v1.3). deny закрыт при любом фильтре: через эти методы видны контакты,
    # звонки и файлы, а batch обходит проверку методов.
    filter:
      keep: [error, error_description, total, next, time.start, time.finish, time.duration, time.processing, time.date_start, time.date_finish]
      deny: [batch, 'crm.contact.*', 'crm.company.*', 'crm.requisite.*', 'crm.address.*', 'crm.activity.*', 'crm.item.*',
        'crm.multifield.*', 'crm.duplicate.*', 'crm.timeline.*', 'telephony.*', 'voximplant.*', 'disk.*', 'im.*', 'imopenlines.*',
        'user.add', 'user.update', 'user.search', 'user.current', 'user.admin', 'user.access', 'user.fields',
        'user.option.*', 'user.userfield.*', 'user.counters', 'department.*', 'calendar.*', 'mailservice.*']
      selectParam: select
      selectFor: [crm.deal.list, crm.lead.list]
      # Типы данных с галочками на странице ключа. defaults — что отмечено, пока владелец не поменял.
      entities:
        deals:
          name: 'Deals'
          methods: [crm.deal.list, crm.deal.get]
          fields:
            - { path: result.ID, label: 'ID' }
            - { path: result.TITLE, label: 'Title' }
            - { path: result.STAGE_ID, label: 'Stage' }
            - { path: result.CATEGORY_ID, label: 'Pipeline' }
