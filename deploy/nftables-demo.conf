# Demo instance (setup.sh --demo): outbound traffic of the gateway user is allowed over loopback
# and as replies to established inbound connections, everything else is dropped.
# Installed as /etc/nftables-demo.conf and loaded with the line
#   include "/etc/nftables-demo.conf"
# added to /etc/nftables.conf at every setup.sh run (setup.sh rewrites the main config
# from the repository each time, so the include is restored by the script itself).
# Check: nft -c -f /etc/nftables-demo.conf
# See docs/DEPLOY.md, section 10.

table inet agw_demo {
  chain output {
    type filter hook output priority filter - 10; policy accept;

    meta skuid gateway oif "lo" accept
    meta skuid gateway ct state established,related accept
    meta skuid gateway limit rate 6/minute log prefix "agw-demo-out: "
    meta skuid gateway drop
  }
}
