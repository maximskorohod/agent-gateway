# Demo instance (setup.sh --demo): drop-in for gateway.service.
# The demo holds no real keys and must not reach the internet even if the code has a bug:
# no IP traffic except loopback (Caddy reaches the gateway on 127.0.0.1), and the demo data
# directory is the one writable path. Installed as /etc/systemd/system/gateway.service.d/demo.conf.
# Check: systemctl show gateway -p IPAddressDeny -p IPAddressAllow -p ReadWritePaths
# See docs/DEPLOY.md, section 10.

[Service]
IPAddressDeny=any
IPAddressAllow=localhost
# The empty assignment clears the path from gateway.service: the demo does not create
# /var/lib/agentkeygate, and a missing path would stop the unit from starting (226/NAMESPACE).
ReadWritePaths=
ReadWritePaths=/var/lib/agentkeygate-demo
