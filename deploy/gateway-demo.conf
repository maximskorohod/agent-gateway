# Demo instance (setup.sh --demo): drop-in for gateway.service.
# The demo holds no real keys and must not reach the internet even if the code has a bug:
# no IP traffic except loopback (Caddy reaches the gateway on 127.0.0.1), writes only to the
# demo data directory. Installed as /etc/systemd/system/gateway.service.d/demo.conf.
# Check: systemctl show gateway -p IPAddressDeny -p IPAddressAllow
# See docs/DEPLOY.md, section 10.

[Service]
IPAddressDeny=any
IPAddressAllow=localhost
ReadWritePaths=/var/lib/agentkeygate-demo
